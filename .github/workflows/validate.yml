name: Validate

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - 'validate.py'
      - 'requirements.txt'
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate showcase data and images
        run: python validate.py
