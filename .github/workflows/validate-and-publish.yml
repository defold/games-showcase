name: Validate and publish showcase

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate showcase data and images
        run: python validate.py

      - if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
        name: Update defold.com
        uses: defold/repository-dispatch@1.2.1
        with:
          repo: defold/defold.github.io
          token: ${{ secrets.SERVICES_GITHUB_TOKEN }}
          user: services@defold.se
          action: games-showcase
